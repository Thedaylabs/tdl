// ?Ä?Ä IndexedDB (?åÏùº ?Ä?? ?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä?Ä
const IDB_NAME='sales_files', IDB_STORE='files', IDB_VER=1;
let idb=null;
function openIDB(){
  return new Promise((res,rej)=>{
    if(idb){res(idb);return;}
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE,{keyPath:'id'});
    req.onsuccess=e=>{idb=e.target.result;res(idb);};
    req.onerror=e=>rej(e.target.error);
  });
}
async function saveFilesToIDB(submissionId, allFiles){
  const db=await openIDB();
  const toBase64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});
  const fileRecords=[];
  for(const f of allFiles){
    const b64=await toBase64(f);
    fileRecords.push({name:f.name, type:f.type, data:b64});
  }
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({id:submissionId, files:fileRecords});
    tx.oncomplete=()=>res();
    tx.onerror=e=>rej(e.target.error);
  });
}

async function getFilesFromIDB(submissionId){
  try{
    const db=await openIDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get(submissionId);
      req.onsuccess=()=>res(req.result?.files||[]);
      req.onerror=e=>rej(e.target.error);
    });
  }catch{ return []; }
}

function populateYearFilter() {

  sel.innerHTML='<option value="">?ÑÏ≤¥ ?∞ÎèÑ</option>';
  years.forEach(y=>{ const opt=document.createElement('option'); opt.value=y; opt.textContent=y+'??; if(y===cur) opt.selected=true; sel.appendChild(opt); });
}

function renderHistory() {

let lbImages=[], lbIdx=0;
function openLb(images,startIdx){
  lbImages=images; lbIdx=startIdx; updateLb();
  document.getElementById('lbOverlay').classList.add('show');
}
function closeLb(){ document.getElementById('lbOverlay').classList.remove('show'); }
function lbMove(dir){ lbIdx=Math.max(0,Math.min(lbImages.length-1,lbIdx+dir)); updateLb(); }
function updateLb(){
  const f=lbImages[lbIdx];
  document.getElementById('lbImg').src=f.data;
  document.getElementById('lbName').textContent=f.name;
  document.getElementById('lbCounter').textContent=`${lbIdx+1} / ${lbImages.length}`;
  document.getElementById('lbPrev').disabled=lbIdx===0;
  document.getElementById('lbNext').disabled=lbIdx===lbImages.length-1;
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lbOverlay').classList.contains('show')) return;
  if(e.key==='ArrowLeft') lbMove(-1);
  if(e.key==='ArrowRight') lbMove(1);
  if(e.key==='Escape') closeLb();
});

function openEditModal(rowId) {
  const all = JSON.parse(localStorage.getItem('sales_data')||'[]');
  const row = all.find(r => r.id === rowId);
  if (!row) return;
  const submittedMs = row.submittedAt ? new Date(row.submittedAt).getTime() : 0;
  if ((Date.now() - submittedMs) >= 2 * 24 * 60 * 60 * 1000) {
    alert('?úÏ∂ú ??2?ºÏù¥ Í≤ΩÍ≥º?òÏó¨ ?òÏ†ï?????ÜÏäµ?àÎã§.');
    return;
  }
  document.getElementById('editRowId').value = rowId;
  document.getElementById('editDom').value  = row.salesDomestic || 0;
  document.getElementById('editOvs').value  = row.salesOverseas || 0;
  document.getElementById('editMemo').value = row.memo || '';
  document.getElementById('editOverlay').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('show');
}

function saveEdit() {
  const rowId = document.getElementById('editRowId').value;
  const dom   = parseInt(document.getElementById('editDom').value)||0;
  const ovs   = parseInt(document.getElementById('editOvs').value)||0;
  const memo  = document.getElementById('editMemo').value.trim();

  const all = JSON.parse(localStorage.getItem('sales_data')||'[]');
  const idx = all.findIndex(r => r.id === rowId);
  if (idx === -1) { alert('?∞Ïù¥?∞Î? Ï∞æÏùÑ ???ÜÏäµ?àÎã§.'); return; }

  const submittedMs = all[idx].submittedAt ? new Date(all[idx].submittedAt).getTime() : 0;
  if ((Date.now() - submittedMs) >= 2 * 24 * 60 * 60 * 1000) {
    alert('?úÏ∂ú ??2?ºÏù¥ Í≤ΩÍ≥º?òÏó¨ ?òÏ†ï?????ÜÏäµ?àÎã§.');
    closeEditModal(); return;
  }

  all[idx].salesDomestic = dom;
  all[idx].salesOverseas = ovs;
  all[idx].salesTotal    = dom + ovs;
  all[idx].memo          = memo;
  localStorage.setItem('sales_data', JSON.stringify(all));

  if (SCRIPT_URL) {
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'submit_sales', data: all[idx] })
    }).catch(() => {});
  }

  closeEditModal();
  loadHistory();
}

function formatDate(iso) {
  if(!iso) return '-';
  try { const d=new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  catch(e){ return iso; }
}
