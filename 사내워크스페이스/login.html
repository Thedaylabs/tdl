<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 더데이랩스 워크스페이스</title>
<link rel="stylesheet" href="/사내워크스페이스/shared.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>더데이랩스 워크스페이스</h1>
    <p class="sub">아이디와 비밀번호로 로그인해주세요.</p>
    <form id="loginForm">
      <div class="form-row">
        <label>아이디</label>
        <input class="input" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-row">
        <label>비밀번호</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">로그인</button>
      <div class="auth-error" id="error"></div>
    </form>
  </div>
</div>
<script src="/사내워크스페이스/shared.js"></script>
<script>
(async () => {
  const { user } = await fetchJSON(`${API_AUTH}?action=me`).catch(() => ({ user: null }));
  if (user) location.href = `${WS_BASE}/index.html`;
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    await fetchJSON(`${API_AUTH}?action=login`, { method: 'POST', body: { action: 'login', username, password } });
    location.href = `${WS_BASE}/index.html`;
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
